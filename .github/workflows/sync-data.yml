name: Generate Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: write

concurrency:
  group: gen-data
  cancel-in-progress: false

env:
  DATA_REPO_DIR: ss-data
  DATA_REPO_URL: https://github.com/MakoStar/ss-data.git

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}

      - name: Clone data repo
        run: |
          TARGET="${{ env.DATA_REPO_DIR }}"
          rm -rf "$TARGET" || true

          git clone --depth 1 \
            https://x-access-token:${{ secrets.GH_TOKEN }}@${DATA_REPO_URL#https://} \
            "$TARGET"

          rm -rf "$TARGET/.git"
          rm -f  "$TARGET/LICENSE" "$TARGET/README.md"

          echo "data repo content："
          ls -la "$TARGET"
        shell: bash

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate data
        run: node scripts/gen-data.cjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dating-events.json data/changelog.json

          if git diff --cached --quiet; then
            echo "unchanged, skipping commit"
            exit 0
          fi

          git commit -m "chore(data): regenerate dating-events & changelog"
          git push
        shell: bash
